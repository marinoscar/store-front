# Vhost template for the SYSTEM nginx at /opt/infra/proxy/nginx/conf.d/
#
# Copy this file to /opt/infra/proxy/nginx/conf.d/<domain>.conf, then replace
# every {{DOMAIN}} and {{STATIC_CONTAINER}} with the real values, e.g.
#
#   {{DOMAIN}}            myhomeimprovementcompany.com
#   {{STATIC_CONTAINER}}  store-front-home-improvement
#
# Container names come from compose.yml ("container_name:"). Both containers
# (this site's static-* and the shared store-front-api) must be on the same
# external "proxy" network as the system nginx.
#
# After editing:
#   1. Obtain a cert:  certbot certonly --webroot -w /opt/infra/proxy/webroot/ -d {{DOMAIN}}
#   2. Reload nginx:   docker exec proxy nginx -s reload

# HTTP — serves ACME challenges and redirects everything else to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name {{DOMAIN}};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — TLS, /api/* → api container, everything else → static container
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name {{DOMAIN}};

    ssl_certificate     /etc/letsencrypt/live/{{DOMAIN}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{DOMAIN}}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    # Backend API — shared across all sites
    location /api/ {
        proxy_pass http://store-front-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;

        # SSE / streaming chat — disable buffering, allow long-lived requests
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 5m;
        proxy_send_timeout 5m;
    }

    # Static site — per-business container
    location / {
        proxy_pass http://{{STATIC_CONTAINER}};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 2m;
}
