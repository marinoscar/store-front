# Internal per-site Nginx config.
# Bind-mounted into every store-front-<site> container as /etc/nginx/conf.d/default.conf.
#
# The host Nginx terminates TLS and routes raul1.marin.cr → 127.0.0.1:8321 (this container),
# raul2.marin.cr → 127.0.0.1:8322 (sibling container with the same config but a different
# bind-mounted dist/ directory).
#
# This config does TWO things:
#   1. Serves the bind-mounted Astro `dist/` at /usr/share/nginx/html
#   2. Proxies /api/* to the shared `store-front-api` container on the internal docker network

upstream store_front_api {
    server store-front-api:3000;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Backend API (chat, uploads, quote, etc.) ---
    location /api/ {
        proxy_pass         http://store_front_api;
        proxy_http_version 1.1;
        proxy_buffering    off;     # SSE chat needs this
        proxy_cache        off;
        proxy_read_timeout 5m;
        proxy_send_timeout 5m;

        proxy_set_header Host              $host;
        proxy_set_header Origin            $http_origin;     # api uses this to resolve sites.config
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    # --- Container healthcheck ---
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # --- Static assets emitted by Astro / Vite (fingerprinted; long-cache) ---
    location /_astro/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- Other static media (week cache) ---
    location ~* \.(?:jpg|jpeg|png|webp|avif|svg|ico|woff2?)$ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # --- HTML never cached — replaced on every deploy ---
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # --- Astro clean URLs (trailingSlash: 'never') ---
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    server_tokens off;
}
